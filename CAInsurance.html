<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CA INSURANCE: ON THE ROAD</title>
    <style>
        :root { --road-dark: #333; --road-lines: #ffd600; --gas-fill: #2e7d32; --text-dark: #212121; --error-red: #c62828; --bg-grey: #e0e0e0; }
        body { background: var(--bg-grey); font-family: sans-serif; padding: 10px; }
        .hud-container { border: 4px solid #212121; max-width: 800px; margin: auto; padding: 20px; background: #fff; border-radius: 12px; }
        .road-pad { height: 100px; background: var(--road-dark); position: relative; margin: 15px 0; border-radius: 5px; overflow: hidden; border: 2px solid #000; }
        .road-pad::after { content: ''; position: absolute; top: 50%; width: 100%; height: 4px; background: repeating-linear-gradient(90deg, var(--road-lines), var(--road-lines) 20px, transparent 20px, transparent 40px); }
        #car { position: absolute; bottom: 10px; left: 5%; font-size: 30px; transition: left 0.5s linear; z-index: 5; transform: scaleX(-1); }
        .drive { left: 90% !important; }
        .shake { animation: driveShake 0.1s linear infinite; }
        @keyframes driveShake { 0%, 100% { transform: scaleX(-1) translateY(0); } 50% { transform: scaleX(-1) translateY(-2px); } }
        .fuel-bar { width: 100%; background: #eee; height: 30px; margin-top: 5px; border-radius: 15px; overflow: hidden; }
        #gas-fill { background: var(--gas-fill); width: 0%; height: 100%; transition: width 0.5s; }
        .mode-toggle { display: flex; background: #eee; border-radius: 25px; margin: 15px 0; padding: 5px; }
        .mode-btn { flex: 1; border: none; padding: 12px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: #212121; color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .p-btn { background: #fff; border: 2px solid #212121; padding: 15px; cursor: pointer; font-weight: bold; border-radius: 6px; }
        .q-text { font-size: 1.1em; margin-bottom: 20px; border-left: 5px solid #212121; padding-left: 15px; font-weight: bold; }
        .ans-btn { display: block; width: 100%; padding: 16px; margin: 8px 0; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; text-align: left; font-weight: bold; cursor: pointer; }
        .nav-btn { background: #212121; color: #fff; padding: 18px; border: none; width: 100%; display: none; }
    </style>
</head>
<body>
    <div class="hud-container">
        <h1>CA INSURANCE: ON THE ROAD</h1>
        <div class="road-pad"><div id="car" class="shake">🚗</div></div>
        <div class="fuel-bar"><div id="gas-fill"></div></div>
        <div id="menu">
            <div class="mode-toggle">
                <button id="mode-sprint" class="mode-btn active" onclick="setMode('sprint')">SPRINT</button>
                <button id="mode-sim" class="mode-btn" onclick="setMode('sim')">SIM</button>
            </div>
            <div class="grid">
                <button class="p-btn" onclick="start(0)">01. GENERAL</button>
                <button class="p-btn" onclick="start(1)">02. LIFE</button>
                <button class="p-btn" onclick="start(2)">03. HEALTH</button>
                <button class="p-btn" onclick="start(3)">04. ETHICS</button>
            </div>
        </div>
<div id="game" style="display:none;">
    <div id="status-line" style="font-size:11px; color:#666; font-weight:bold; margin-bottom:10px;"></div>
    
    <div id="q-area"></div>
    <button id="next" class="nav-btn" onclick="next()">NEXT MILE ></button>
</div>
<script>
// ============================================================================
// BANK 1: SPRINT LIB (2-CHOICE QUICK RECALL)
// ============================================================================
const sprintLib = [
    [ // PILLAR 1: GENERAL INSURANCE CONCEPTS (50 Questions)
        {q: "Under the California Insurance Code (CIC), the word 'shall' indicates:", c: ["Mandatory compliance", "Permissive action"], a: 0, f: "Logic: CIC defines 'shall' as mandatory and 'may' as permissive."},
        {q: "When must insurable interest exist in life insurance?", c: ["At the time of application", "At the time of the insured's death"], a: 0, f: "Logic: Insurable interest in life policies must only exist at inception."},
        {q: "When must insurable interest exist in property insurance?", c: ["At the exact time of the loss", "At the time of policy application"], a: 0, f: "Logic: Property insurance requires insurable interest when the damage occurs."},
        {q: "An insurance contract is an 'Adhesion' contract because:", c: ["One party prepares it and the other must accept it as-is", "Both parties negotiate the terms equally"], a: 0, f: "Logic: Because the insurer drafts it, ambiguities are resolved in favor of the insured."},
        {q: "A contract involving an unequal exchange of value based on chance is an:", c: ["Aleatory contract", "Executory contract"], a: 0, f: "Logic: Aleatory contracts involve unequal exchanges based on uncertain future events."},
        {q: "A contract where only one party makes a legally enforceable promise is:", c: ["Unilateral", "Bilateral"], a: 0, f: "Logic: Only the insurer is legally bound to act; the insured can stop paying anytime."},
        {q: "The Principle of Indemnity is designed to prevent the insured from:", c: ["Profiting from a covered loss", "Canceling the policy early"], a: 0, f: "Logic: Indemnity means 'to make whole', restoring you to your exact pre-loss financial state."},
        {q: "Insurance policies operate under the assumption that both parties are acting honestly. This is:", c: ["Utmost Good Faith", "Subrogation"], a: 0, f: "Logic: Utmost Good Faith requires both parties to rely completely on each other's honesty."},
        {q: "Neglecting to communicate a known material fact is legally defined as:", c: ["Concealment", "Warranty breach"], a: 0, f: "Logic: Concealment, whether intentional or unintentional, allows the injured party to rescind."},
        {q: "When an applicant intentionally distorts the truth to secure a lower rate, this is:", c: ["Misrepresentation", "Estoppel"], a: 0, f: "Logic: Misrepresentation is actively lying; concealment is passively withholding."},
        {q: "A statement guaranteed to be literally true in all respects is a:", c: ["Warranty", "Representation"], a: 0, f: "Logic: Warranties require absolute truth. A breach can void the policy automatically."},
        {q: "Statements on an application believed to be true to the best of one's knowledge are:", c: ["Representations", "Warranties"], a: 0, f: "Logic: Application statements are representations; they only require substantial truth."},
        {q: "When can a representation in an insurance contract be altered or withdrawn?", c: ["Before the insurance goes into effect", "At any time during the policy lifecycle"], a: 0, f: "Logic: You can only alter representations before the policy is executed."},
        {q: "Materiality of a concealed fact is determined by:", c: ["Its influence on the insurer's underwriting decision", "The subjective intent of the applicant"], a: 0, f: "Logic: Materiality relies on whether the fact would have changed the rating or approval."},
        {q: "What type of risk involves only the chance of loss and no chance of gain?", c: ["Pure Risk", "Speculative Risk"], a: 0, f: "Logic: Pure risk is the only type of risk that is insurable."},
        {q: "Gambling or investing in the stock market are examples of:", c: ["Speculative Risk", "Pure Risk"], a: 0, f: "Logic: Speculative risks feature a chance of gain, making them completely uninsurable."},
        {q: "A condition that increases the probability or severity of a loss is a:", c: ["Hazard", "Peril"], a: 0, f: "Logic: A hazard increases the likelihood of a loss occurring."},
        {q: "The actual cause of a loss, such as a fire, lightning, or heart attack, is defined as a:", c: ["Peril", "Hazard"], a: 0, f: "Logic: The peril is the damaging force itself."},
        {q: "An applicant lying on an application due to dishonest tendencies presents a:", c: ["Moral Hazard", "Morale Hazard"], a: 0, f: "Logic: Moral hazard stems from character flaws or criminal/fraudulent intent."},
        {q: "An insured leaving their keys in an unlocked car out of carelessness represents a:", c: ["Morale Hazard", "Moral Hazard"], a: 0, f: "Logic: Morale (with an 'e') is an attitude of carelessness or indifference."},
        {q: "A tangible condition, like an icy sidewalk or exposed wiring, is a:", c: ["Physical Hazard", "Morale Hazard"], a: 0, f: "Logic: Physical hazards are material conditions that increase risk."},
        {q: "The mathematical rule allowing insurers to accurately predict future loss ratios is the:", c: ["Law of Large Numbers", "Principle of Indemnity"], a: 0, f: "Logic: The larger the pool of exposures, the more predictable the overall losses become."},
        {q: "Deciding not to skydive to prevent injury is an example of risk:", c: ["Avoidance", "Reduction"], a: 0, f: "Logic: Avoidance completely eliminates the exposure to the activity."},
        {q: "Choosing a higher deductible to lower your monthly premium is a form of risk:", c: ["Retention", "Transfer"], a: 0, f: "Logic: Retention (self-insurance) means assuming part of the financial burden yourself."},
        {q: "Purchasing a life insurance policy is an example of risk:", c: ["Transfer", "Avoidance"], a: 0, f: "Logic: You are transferring the financial risk of death to the insurance carrier."},
        {q: "Installing a security alarm system or smoke detector is an example of risk:", c: ["Reduction", "Transfer"], a: 0, f: "Logic: Reduction minimizes the likelihood or severity of a loss without avoiding the activity."},
        {q: "An insurer chartered and incorporated under the laws of California is a:", c: ["Domestic Insurer", "Foreign Insurer"], a: 0, f: "Logic: Domestic means native to the specific state in question."},
        {q: "An insurer chartered in Nevada but selling policies in California is classified as a:", c: ["Foreign Insurer", "Alien Insurer"], a: 0, f: "Logic: Foreign means chartered in another U.S. state."},
        {q: "An insurer incorporated in Germany operating in California is a/an:", c: ["Alien Insurer", "Foreign Insurer"], a: 0, f: "Logic: Alien means chartered completely outside the United States."},
        {q: "An insurer granted a Certificate of Authority by the CA Insurance Commissioner is an:", c: ["Admitted Insurer", "Non-admitted Insurer"], a: 0, f: "Logic: Admitted (authorized) carriers are fully cleared to do business in the state."},
        {q: "A Non-Admitted insurer is legally permitted to transact business in CA only through a:", c: ["Surplus Lines Broker", "Managing General Agent"], a: 0, f: "Logic: Surplus Lines brokers handle high-risk placements with unauthorized carriers."},
        {q: "An insurance company owned entirely by its policyholders is a:", c: ["Mutual Insurer", "Stock Insurer"], a: 0, f: "Logic: Mutual companies issue participating policies that pay non-taxable dividends to owners."},
        {q: "An insurance company owned by shareholders that pays taxable dividends is a:", c: ["Stock Insurer", "Mutual Insurer"], a: 0, f: "Logic: Stock companies distribute taxable profits to their external investors."},
        {q: "A non-profit organization offering life insurance solely to members of a specific lodge is a:", c: ["Fraternal Benefit Society", "Reciprocal Exchange"], a: 0, f: "Logic: Fraternals combine social organization with specialized insurance benefits."},
        {q: "The process where one insurer transfers a portion of its risk to another insurer is:", c: ["Reinsurance", "Subrogation"], a: 0, f: "Logic: Reinsurance prevents catastrophic losses from bankrupting a single carrier."},
        {q: "In a reinsurance transaction, the primary insurer that passes the risk outward is the:", c: ["Ceding Company", "Reinsurer"], a: 0, f: "Logic: The ceding company 'cedes' or yields the risk to the backup carrier."},
        {q: "An agent's authority explicitly spelled out in their written agency contract is:", c: ["Express Authority", "Implied Authority"], a: 0, f: "Logic: Express authority is physically written in black and white."},
        {q: "Authority not written but necessary for the agent to conduct routine business is:", c: ["Implied Authority", "Apparent Authority"], a: 0, f: "Logic: Implied authority allows agents to do basic tasks like collecting initial premiums."},
        {q: "Authority created when an insurer's actions make a client reasonably believe the agent has power is:", c: ["Apparent Authority", "Express Authority"], a: 0, f: "Logic: If the carrier gives an agent company letterhead, they create apparent authority."},
        {q: "In California, who legally represents the insurance company during a transaction?", c: ["Insurance Agent", "Insurance Broker"], a: 0, f: "Logic: Agents represent the carrier. Brokers represent the consumer."},
        {q: "An individual employed by an agent to assist in transacting insurance, but who cannot bind coverage, is a:", c: ["Solicitor", "Broker"], a: 0, f: "Logic: Solicitors assist agents but lack principal binding authority."},
        {q: "A professional who charges a fee to provide objective advice on life insurance portfolios is a:", c: ["Life and Disability Analyst", "Managing General Agent"], a: 0, f: "Logic: Analysts act independently and charge consulting fees via written agreements."},
        {q: "When an agent collects premium cash from a client, they are legally acting in a:", c: ["Fiduciary Capacity", "Corporate Capacity"], a: 0, f: "Logic: Handling client money triggers an absolute fiduciary duty of trust."},
        {q: "Mixing client premium funds directly with an agent's personal checking account is the illegal act of:", c: ["Commingling", "Twisting"], a: 0, f: "Logic: Commingling is misappropriation and theft of fiduciary funds."},
        {q: "A temporary contract providing coverage while the formal application is underwritten is a:", c: ["Binder", "Rider"], a: 0, f: "Logic: Binders provide immediate, short-term coverage for property/casualty risks."},
        {q: "Can a Life Insurance agent issue a formal binding receipt (Binder) for a life policy?", c: ["No, life agents only issue conditional receipts", "Yes, for up to $1,000,000"], a: 0, f: "Logic: Binders are not allowed in life insurance due to strict medical underwriting requirements."},
        {q: "The element of 'Offer and Acceptance' is satisfied when the applicant:", c: ["Submits a completed application and the initial premium", "Receives the physical policy"], a: 0, f: "Logic: The applicant makes the 'offer' with cash; the insurer 'accepts' upon approval."},
        {q: "In contract law, what does the insurer provide as its 'Consideration'?", c: ["A legal promise to pay in the event of a covered loss", "The physical policy booklet"], a: 0, f: "Logic: The carrier's consideration is the enforceable promise to indemnify."},
        {q: "A contract insuring an illegal drug smuggling operation is void because it lacks:", c: ["Legal Purpose", "Competent Parties"], a: 0, f: "Logic: All insurance contracts must have a lawful objective to be valid."},
        {q: "The legal doctrine preventing an insurer from denying a claim based on a previous agent statement is:", c: ["Estoppel", "Adverse Selection"], a: 0, f: "Logic: Estoppel 'stops' a party from going back on a promise another party relied upon."}
    ],
[ // PILLAR 2: LIFE INSURANCE & TAXATION (50 Questions)
        {q: "If a policy fails the 7-pay test, it is classified as a:", c: ["Modified Endowment Contract (MEC)", "Variable Universal Life (VUL) policy"], a: 0, f: "Logic: Breaching the 7-pay limit turns the policy into a MEC, permanently altering its tax status."},
        {q: "Cash value loans taken from a Modified Endowment Contract (MEC) are taxed on what basis?", c: ["LIFO (Last-In, First-Out)", "FIFO (First-In, First-Out)"], a: 0, f: "Logic: MECs strip the tax-free loan privilege, forcing earnings out first as taxable ordinary income."},
        {q: "An early withdrawal from a MEC before age 59.5 triggers an additional IRS penalty of:", c: ["10%", "50%"], a: 0, f: "Logic: Like an IRA, MEC early distributions face a 10% penalty on the taxable earnings."},
        {q: "A lump-sum life insurance death benefit paid to a named beneficiary is generally:", c: ["Tax-free", "Taxable as ordinary income"], a: 0, f: "Logic: Death benefits pass to beneficiaries entirely free of federal income tax."},
        {q: "If a beneficiary leaves the death benefit with the insurer to earn interest, the interest is:", c: ["Taxable as ordinary income", "Completely tax-free"], a: 0, f: "Logic: The principal death benefit is tax-free, but any interest generated on it is taxable."},
        {q: "Are premiums paid for an individual, personal life insurance policy tax-deductible?", c: ["No, they are paid with after-tax dollars", "Yes, they are fully deductible"], a: 0, f: "Logic: Personal life insurance premiums are never tax-deductible."},
        {q: "Employer-paid group term life insurance premiums are tax-free to the employee up to what face amount?", c: ["$50,000", "$100,000"], a: 0, f: "Logic: Group life coverage over $50,000 triggers 'imputed income' taxes for the employee."},
        {q: "Which IRC section permits a tax-free exchange of one life insurance policy for another?", c: ["Section 1035", "Section 162"], a: 0, f: "Logic: Section 1035 allows tax-free swaps (Life to Life, Life to Annuity, Annuity to Annuity)."},
        {q: "Can a consumer execute a tax-free 1035 exchange from an Annuity into a Life Insurance policy?", c: ["No, this triggers immediate taxation", "Yes, it is fully permitted"], a: 0, f: "Logic: 1035 rules are one-way. You cannot trade an annuity for a life policy without paying taxes."},
        {q: "In a Key Person life insurance policy, how are the premiums treated for tax purposes?", c: ["Not deductible by the business", "Fully deductible as a business expense"], a: 0, f: "Logic: The business pays with after-tax dollars, making the massive death benefit tax-free."},
        {q: "In an Executive Bonus Plan (Section 162), who owns the life insurance policy?", c: ["The executive", "The employer"], a: 0, f: "Logic: The executive owns the policy and pays income tax on the premium bonus provided by the employer."},
        {q: "Which business continuation plan involves each partner owning a policy on every other partner?", c: ["Cross-Purchase Plan", "Entity Purchase Plan"], a: 0, f: "Logic: Cross-Purchase means partners cross-insure each other. Entity means the business owns the policies."},
        {q: "What nonforfeiture option provides the longest duration of continuous permanent coverage?", c: ["Reduced Paid-Up", "Extended Term"], a: 0, f: "Logic: Reduced Paid-Up lowers the face amount but keeps the policy active permanently (to age 121)."},
        {q: "What nonforfeiture option provides the highest face amount of protection?", c: ["Extended Term", "Cash Surrender"], a: 0, f: "Logic: Extended term maintains the exact original face amount, but converts it to temporary term coverage."},
        {q: "If a policyowner selects the 'Accumulate at Interest' dividend option, the interest earned is:", c: ["Taxable annually", "Tax-deferred"], a: 0, f: "Logic: The dividend itself is a tax-free return of premium, but the interest it generates is taxable."},
        {q: "Which dividend option buys small blocks of permanent whole life insurance?", c: ["Paid-Up Additions", "One-Year Term Option"], a: 0, f: "Logic: Paid-Up Additions increase the death benefit and build their own compounding cash value."},
        {q: "Which settlement option guarantees payouts for a specific number of years, regardless of lifespan?", c: ["Fixed Period", "Life Income"], a: 0, f: "Logic: Fixed Period ensures the funds are drained over an exact timeline (e.g., 10 years)."},
        {q: "Which settlement option pays the highest monthly amount but stops immediately at death?", c: ["Straight Life / Pure Life", "Life with Period Certain"], a: 0, f: "Logic: Straight life carries the highest risk of forfeiture, thus yielding the largest monthly check."},
        {q: "If an insured dies during the 31-day grace period, what happens to the death benefit?", c: ["The carrier pays the claim but deducts the overdue premium", "The claim is denied due to lapse"], a: 0, f: "Logic: The grace period keeps the policy active. The missed premium is simply settled from the payout."},
        {q: "The Incontestability Clause prevents an insurer from denying a claim for material fraud after:", c: ["2 years", "5 years"], a: 0, f: "Logic: Once the policy has been active for 2 years, the carrier cannot dispute application omissions."},
        {q: "If the insured commits suicide within the first two years of the policy, the insurer will:", c: ["Refund all premiums paid to the beneficiary", "Pay the full face amount"], a: 0, f: "Logic: The Suicide Clause prevents a full payout within the first 2 years, limiting liability to a premium refund."},
        {q: "If the insured lied about their age on the application and dies 10 years later, the insurer will:", c: ["Adjust the death benefit mathematically", "Void the policy completely"], a: 0, f: "Logic: Misstatement of Age never voids coverage; it simply recalculates the payout based on correct math."},
        {q: "Which beneficiary designation requires the beneficiary's signature to make policy changes?", c: ["Irrevocable", "Revocable"], a: 0, f: "Logic: Irrevocable beneficiaries are locked in. The owner cannot take loans or change names without their consent."},
        {q: "Which clause protects death benefit proceeds from the beneficiary's creditors before distribution?", c: ["Spendthrift Clause", "Common Disaster Clause"], a: 0, f: "Logic: Spendthrift clauses act as a shield, preventing creditors from garnishing the insurance payouts."},
        {q: "A permanent transfer of all ownership rights in a life policy to a third party is an:", c: ["Absolute Assignment", "Collateral Assignment"], a: 0, f: "Logic: Absolute assignment transfers full title. Collateral assignment is temporary (to secure a loan)."},
        {q: "A policyowner sells their active life policy to an investment firm for immediate cash. This is a:", c: ["Viatical / Life Settlement", "Section 1035 Exchange"], a: 0, f: "Logic: Life settlements allow owners to liquidate policies on the secondary market for more than cash value."},
        {q: "Which policy features flexible premiums and an unbundled cash value component?", c: ["Universal Life", "Whole Life"], a: 0, f: "Logic: Universal Life allows owners to adjust premiums and face amounts dynamically."},
        {q: "Which policy shifts investment risk to the consumer via a Separate Account?", c: ["Variable Life", "Indexed Universal Life"], a: 0, f: "Logic: Variable products invest in equities, requiring dual state and SEC/FINRA oversight."},
        {q: "Which policy is designed specifically to pay off a declining mortgage balance?", c: ["Decreasing Term", "Level Term"], a: 0, f: "Logic: Decreasing term features a dropping face amount that mirrors an amortization schedule."},
        {q: "A Return of Premium (ROP) term policy mathematically achieves the refund by using an:", c: ["Increasing Term Rider", "Accelerated Benefit Rider"], a: 0, f: "Logic: ROP is an illusion created by adding an increasing term rider that matches premiums paid."},
        {q: "Under modern mortality tables, a straight Whole Life policy endows when the insured reaches age:", c: ["121 (or 100 on older tables)", "65"], a: 0, f: "Logic: Whole life policies endow when the cash value perfectly equals the face amount at the end of the mortality table."},
        {q: "Which rider waives premiums if the adult paying for a juvenile policy becomes disabled?", c: ["Payor Benefit Rider", "Waiver of Premium Rider"], a: 0, f: "Logic: Payor Benefit protects the child's coverage if the adult funding it is incapacitated."},
        {q: "Which rider allows purchasing additional coverage at future ages without a medical exam?", c: ["Guaranteed Insurability Rider", "Cost of Living Rider"], a: 0, f: "Logic: Guaranteed Insurability secures the right to expand coverage regardless of deteriorating health."},
        {q: "Which rider unlocks a portion of the death benefit early if the insured is diagnosed with 6 months to live?", c: ["Accelerated Death Benefit", "Disability Income Rider"], a: 0, f: "Logic: Accelerated benefits provide liquidity for terminal or critical illnesses prior to death."},
        {q: "Annuities are primarily designed to protect consumers against the risk of:", c: ["Outliving their retirement income", "Dying prematurely"], a: 0, f: "Logic: Life insurance creates an estate upon early death; annuities liquidate an estate to prevent outliving money."},
        {q: "An annuity purchased with a lump sum that begins payouts within 12 months is an:", c: ["Immediate Annuity (SPIA)", "Deferred Annuity (SPDA)"], a: 0, f: "Logic: Immediate annuities bypass the accumulation phase entirely to trigger immediate income."},
        {q: "During the accumulation phase of a deferred annuity, the account growth is:", c: ["Tax-deferred", "Taxable annually"], a: 0, f: "Logic: Annuities provide a tax shelter, allowing interest to compound without current taxation."},
        {q: "If an annuitant dies during the accumulation phase, what does the beneficiary receive?", c: ["The greater of the original principal or current value", "Only the original principal"], a: 0, f: "Logic: The beneficiary is guaranteed to receive at least what was paid in, or the current market value."},
        {q: "Which annuity offers a guaranteed minimum floor but links growth to the S&P 500?", c: ["Equity-Indexed Annuity", "Variable Annuity"], a: 0, f: "Logic: Indexed annuities are fixed products that capture market upside without exposing principal to market drops."},
        {q: "When annuitizing a non-qualified contract, what calculates the tax-free return of principal?", c: ["The Exclusion Ratio", "The Rule of 72"], a: 0, f: "Logic: The Exclusion Ratio separates your original after-tax seed money from the taxable earnings."},
        {q: "A withdrawal from a deferred annuity during the accumulation phase is taxed on a:", c: ["LIFO basis (Earnings first)", "FIFO basis (Principal first)"], a: 0, f: "Logic: Annuity withdrawals pull taxable earnings out first, penalized if under age 59.5."},
        {q: "Which policy covers two lives but pays out ONLY when the second person dies?", c: ["Survivorship (Second-to-Die)", "Joint Life (First-to-Die)"], a: 0, f: "Logic: Survivorship policies are used heavily in estate planning to pay federal estate taxes after both spouses pass."},
        {q: "A Joint Life (First-to-Die) policy compared to a Survivorship policy will typically have:", c: ["A higher premium", "A lower premium"], a: 0, f: "Logic: Joint Life pays when the FIRST person dies (higher statistical risk, higher premium)."},
        {q: "Which provision provides retroactive coverage if the underwriter approves the application?", c: ["Conditional Receipt", "Binding Receipt"], a: 0, f: "Logic: Conditional receipts offer coverage back to the exam date, provided the risk is acceptable."},
        {q: "Underwriting an applicant with a hazardous hobby (skydiving) by excluding death from that activity uses an:", c: ["Aviation/Hazard Exclusion", "Impairment Rider"], a: 0, f: "Logic: Exclusions allow carriers to issue policies by stripping out coverage for specific dangerous activities."},
        {q: "Charging a deep-sea welder an extra $5.00 per $1,000 of coverage is an example of a:", c: ["Flat Rate Surcharge", "Tabular Rating"], a: 0, f: "Logic: Flat rate surcharges assess a constant penalty per thousand dollars of coverage for hazardous jobs."},
        {q: "The lowest risk underwriting tier featuring the cheapest premium rates is:", c: ["Preferred", "Standard"], a: 0, f: "Logic: Preferred tiers are awarded for optimal health and lifestyle profiles."},
        {q: "What protects an insurer if an applicant asks to backdate a policy to save their younger age?", c: ["Applicant must pay all back-due premiums", "Applicant signs a fraud waiver"], a: 0, f: "Logic: Backdating saves age, but the applicant must pay the 'missed' premiums for those backdated months."},
        {q: "Which whole life policy charges premiums for exactly 20 years, then requires no more payments?", c: ["Limited-Pay Whole Life", "Graded Premium Life"], a: 0, f: "Logic: Limited-pay condenses the premium schedule but covers the insured permanently to age 121."},
        {q: "The 'Facility of Payment' clause in industrial life insurance allows the insurer to:", c: ["Pay a relative who incurred funeral expenses", "Convert the policy to an annuity"], a: 0, f: "Logic: This clause bypasses probate, allowing carriers to quickly reimburse whoever paid for the funeral."}
    ],
[ // PILLAR 3: ACCIDENT & HEALTH / MEDICARE (50 Questions)
        {q: "Which disability definition is the most restrictive and hardest to qualify for?", c: ["Any Occupation", "Own Occupation"], a: 0, f: "Logic: 'Any Occ' means you must be unable to perform ANY job, making it much harder to collect benefits."},
        {q: "Under the ACA, what is the maximum age a dependent child can remain on a parent's health plan?", c: ["Age 26", "Age 30"], a: 0, f: "Logic: Dependents can stay on the plan until their 26th birthday."},
        {q: "Long-Term Care (LTC) policies trigger benefits when the insured cannot perform at least:", c: ["2 ADLs", "3 ADLs"], a: 0, f: "Logic: The standard trigger requires the inability to perform 2 out of 6 Activities of Daily Living."},
        {q: "The guaranteed-issue open enrollment window for Medicare Supplement (Medigap) policies lasts for:", c: ["6 months", "3 months"], a: 0, f: "Logic: It begins the month you turn 65 and enroll in Part B, lasting exactly 6 months."},

// --- ENGINE LOGIC ---
let audioCtx;
let activeSet = [], idx = 0, currentPillar = 0, sessionScore = 0, mode = 'sprint';

function playTone(freq, dur) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) { console.error("Audio blocked:", e); }
}

function setMode(m) {
    mode = m;
    document.getElementById('mode-sprint').className = m === 'sprint' ? 'mode-btn active' : 'mode-btn';
    document.getElementById('mode-sim').className = m === 'sim' ? 'mode-btn active' : 'mode-btn';
    document.getElementById('game').style.display = 'none';
    document.getElementById('menu').style.display = 'block';
}

function start(pillar) {
    currentPillar = pillar;
    idx = 0; sessionScore = 0;
    
    // Safety: Select correct library based on mode
    const sourceLib = (mode === 'sprint') ? sprintLib[pillar] : simLib[pillar];
    
    // Safety: If library is empty, alert user instead of crashing
    if (!sourceLib || sourceLib.length === 0) {
        alert("This pillar is empty! Please populate your arrays with questions.");
        return;
    }
    
    // Select questions based on mode
    activeSet = [...sourceLib].slice(0, (mode === 'sprint' ? 10 : 30));
    
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    updateVisuals();
    showQuestion();
}

function updateVisuals() {
    let pct = activeSet.length > 0 ? (idx / activeSet.length) * 100 : 0;
    document.getElementById('gas-fill').style.width = pct + '%';
    document.getElementById('car').style.left = (pct * 0.85) + '%';
}

function showQuestion() {
    document.getElementById('next').style.display = 'none';
    const q = activeSet[idx];
    document.getElementById('status-line').innerText = `PILLAR 0${currentPillar + 1} | MILE ${idx + 1} OF ${activeSet.length}`;
    
    let html = `<div class="q-text">${q.q}</div>`;
    html += q.c.map((text, i) => `<button class="ans-btn" onclick="check(${i === q.a}, this)">${text}</button>`).join('');
    document.getElementById('q-area').innerHTML = html;
}

function check(isCorrect, btn) {
    document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
    if (isCorrect) {
        btn.style.background = "#e8f5e9";
        btn.style.borderColor = "#2e7d32";
        sessionScore++;
        playTone(600, 0.1);
    } else {
        btn.style.background = "#ffebee";
        btn.style.borderColor = "#c62828";
        playTone(200, 0.2);
    }
    document.getElementById('next').style.display = 'block';
}

function next() {
    idx++;
    if (idx < activeSet.length) {
        updateVisuals();
        showQuestion();
    } else {
        alert("Journey Complete! Score: " + Math.round((sessionScore / activeSet.length) * 100) + "%");
        window.location.reload();
    }
}
